<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Harry Hamlin</title>
    <!--
      GitHub Pages has no server-side routing, so a deep link like /climbing
      returns this 404 page. This script rewrites the path into a query and
      redirects to the app root; index.html restores the real path so React
      Router can handle it. See https://github.com/rafgraph/spa-github-pages
      pathSegmentsToKeep = 0 because the site is served from the domain root.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
